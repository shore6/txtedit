name = "txtedit"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 静的ファイル (public/) は Workers Static Assets で配信し、/api/* だけを Worker が処理する
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "txtedit"
# `npx wrangler d1 create txtedit` で表示される database_id に置き換えてください
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
