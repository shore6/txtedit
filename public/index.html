<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>txtedit</title>
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form">
    <h1>txtedit</h1>
    <p>アクセストークンを入力してください。</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="AUTH_TOKEN" required>
    <button type="submit">ログイン</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="search-row">
        <input id="search" type="search" placeholder="ファイル名・本文を検索 (Ctrl+K)" autocomplete="off" spellcheck="false">
        <button id="close-side" class="icon" title="閉じる" aria-label="閉じる">✕</button>
      </div>
      <div class="side-actions">
        <button id="new-file" title="新規ファイル">＋ ファイル</button>
        <button id="new-folder" title="新規フォルダ">＋ フォルダ</button>
        <button id="more" title="その他" aria-haspopup="menu">⋯</button>
      </div>
    </div>
    <nav id="tree" class="tree"></nav>
    <div id="results" class="results" hidden></div>
  </aside>

  <main class="main">
    <header class="bar">
      <button id="toggle-side" class="icon" title="ファイル一覧" aria-label="ファイル一覧">☰</button>
      <button id="title" class="title" title="名前変更・移動"></button>
      <span id="status" class="status"></span>
      <button id="file-menu" class="icon" title="ファイル操作" aria-label="ファイル操作" aria-haspopup="menu">⋯</button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" disabled></textarea>
    <div id="empty" class="empty">ファイルを選択するか、「＋ ファイル」で作成してください。</div>
  </main>
</div>

<div id="menu" class="menu" role="menu" hidden></div>

<div id="merge" class="modal" hidden>
  <div class="modal-box">
    <header>
      <h2>競合の解決</h2>
      <p>他の端末でも同じ箇所が編集されました。ブロックごとに採用する内容を選んでください。</p>
      <div class="merge-all">
        <button data-all="mine">すべて自分</button>
        <button data-all="theirs">すべてサーバー</button>
        <button data-all="both">すべて両方</button>
      </div>
    </header>
    <div id="merge-body" class="merge-body"></div>
    <footer>
      <button id="merge-markers" class="secondary">マーカー付きで手動編集</button>
      <button id="merge-cancel" class="secondary">あとで</button>
      <button id="merge-apply">適用</button>
    </footer>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input id="import" type="file" accept=".txt,text/plain" multiple hidden>
</body>
</html>
